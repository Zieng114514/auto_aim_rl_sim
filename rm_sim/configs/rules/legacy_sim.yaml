# =============================================================================
#  legacy_sim —— "我们一直用到现在的简化模型"（默认规则集）
#
#  ⚠️ 这个文件的数值**必须**与 rm_gun.py / rm_cars.py 里的历史默认值逐项一致：
#     它是"配置层不存在时"的行为，是既有全部基线（4 种子 46.5% vs 39.0%）
#     可复现的前提。改动它 = 改动基线，必须同步改文档并重录基线。
#
#  与真实规则（rules/rmuc_2026.yaml）的已知差异都写在 sim_gaps 里，便于对照。
# =============================================================================
version: legacy_sim
source_doc: "项目内部简化模型（不是规则手册值）"
fidelity: simplified

gun:
  # ---- 摩擦轮弹速 ----
  speed_cold: 22.0              # 也是发给视觉的"标称速度"
  speed_warm: 24.0
  tau_warm_shots: 20.0          # 升温时间常数（单位：发）
  tau_cool_s: 90.0              # 降温时间常数（单位：秒）
  jitter_mps_2sigma: 0.5        # 每发弹速随机波动（按 2σ 解释 -> σ=0.25）
  # ---- 热量 ----
  heat_max: 100.0
  heat_per_shot: 10.0
  heat_cool_per_s: 10.0
  lock_policy: block_single     # legacy：只拒绝"会顶破上限的那一发"；超了也能接着打
  overheat_damage_k: 2.0        # 超限扣我方血量（与超出量成正比），真机是锁枪+断图传
  self_hp_max: 600.0
  # ---- 散布 ----
  spread_deg_per_axis: 0.15
  model_flags: {speed: true, heat: true, spread: true}

target_car:
  hp: 600                       # 【负责人指定】沿用既有基线口径
  damage_per_17mm_hit: 20
  hits_per_kill: 30             # = 600 / 20
  respawn: instant_full_hp      # legacy：死了立刻满血重生（真机是读条复活）
  ammo: infinite

sim_gaps:                       # 与本轮规则（rmuc_2026）的差异清单
  - "热量：固定 100/10 每秒；真规则按机器人·等级·发射机构类型（步兵 40~260、冷却 5~30）"
  - "超限：只拒单发；真规则是锁枪直到 Q1=0，超过 Q2 本局永久锁"
  - "初速超限惩罚、底盘功率缓冲能量、暴击区、检测最小间隔/最小速度：未建模"
  - "42mm 与英雄、等级/经验、回血/复活读条、弹药经济、基地/前哨站：未建模"
