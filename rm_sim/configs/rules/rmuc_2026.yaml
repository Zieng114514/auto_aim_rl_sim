# =============================================================================
#  RMUC 2026 赛季规则集（裁判系统语义）
#
#  出处：RoboMaster 2026 机甲大师超级对抗赛比赛规则手册 V2.2.0（20260807）
#  逐条标注 PDF 页码；印刷页码 = PDF 页码 - 1。
#
#  ⚠️ 默认不启用（`--ruleset legacy_sim`）。启用后射速预算/每杀所需命中数/
#     超限代价都会变，**既有基线不可直接对比**，必须重新录一套。
# =============================================================================
version: RMUC-2026-V2.2.0
source_doc: "规则手册 V2.2.0（20260807），PDF 159 页"
fidelity: exact

# ---------------------------------------------------------------- 伤害（§5.1.1）
# 表 5-2（PDF p68）。弹丸侧的 damage 在 projectiles.yaml，这里放"裁判语义"。
damage:
  collision: 2                                  # 撞击（规则不允许靠撞击造成伤害）
  source: "§5.1.1 表 5-2 (PDF p68)"

detect:                                         # 表 5-1（PDF p68）
  p17: {min_interval_ms: 50,  min_speed_mps: 12}
  p42: {min_interval_ms: 200, min_speed_mps: 10}
  velocity_basis: normal_component              # 以接触面法向分量为准
  source: "§5.1.1 表 5-1 (PDF p68)"

# ---------------------------------------------------------------- 热量（§5.1.3）
heat:
  settle_hz: 10                                 # 冷却按 10Hz 结算
  per_shot: {p17: 10, p42: 100}                 # 与初速无关
  q2_offset: {p17: 100, p42: 200}               # Q2 = Q0 + offset
  over_q0:                                      # Q2 > Q1 > Q0
    effect: [lock_launcher, cut_video]
    unlock_when: "q1 == 0"                      # ★ 必须降到 0 才解锁（不是降到 Q0 以下）
  over_q2:
    effect: permanent_lock                      # 本局后续全部时间锁定，不再解锁
  source: "§5.1.3 + 图 5-1 (PDF p70)"
  sim_note: "legacy 模型是'只拒绝会顶破上限的那一发'，语义不同，见 rules/legacy_sim.yaml"

# ---------------------------------------------------------------- 初速超限（§5.1.2）
speed_limit:
  p17:    [{d_over: [0, 5],  lock_s: 15}, {d_over: [5, 10], lock_s: 20}, {d_over: [10, null], lock_s: permanent}]
  p42:    [{d_over_ratio: [1.0, 1.1], lock_s: 15}, {d_over_ratio: [1.1, 1.2], lock_s: 20},
           {d_over_ratio: [1.2, null], lock_s: permanent}]
  p42_deployed: [{v1_max: 18, lock_s: 15}, {v1_max: null, lock_s: permanent}]
  lock_accumulates: false                       # 时间不累加
  source: "§5.1.2 表 5-3 (PDF p69)"
  sim_note: "实践里很少触发（队伍把摩擦轮转速固定住，冷枪弹速留余量）；先只配置化，不接主回路"

# ---------------------------------------------------------------- 底盘功率（§5.1.4）
chassis_power:
  buffer_energy_j: 60
  settle_hz: 10
  cut_off_s: 5
  source: "§5.1.4 (PDF p70-71)"

# ---------------------------------------------------------------- 等级与性能（§5.4）
# 表 5-13~5-16（PDF p94-98）。level 1..10。
level:
  max: 10
  exp_to_level: {1: 0, 2: null, 3: null, 4: null, 5: null, 6: null, 7: null, 8: null, 9: null, 10: 5000}
  exp_gain:                                     # §5.4.1 (PDF p91)
    per_shot: {p17: 1, p42: 10}                 # 步兵/空中 +1；英雄 +10
    per_damage: {robot: 4, outpost: 2, base: 0.5}   # 基地"每 2 点伤害 +1 经验"（奇数向上取整）
  sim_note: "★ 暂不建模（负责人 2026-10-14：偏向后期工作）；先只写进配置"
  robots:
    hero:
      launcher: p42
      v0_limit_mps: 12
      whole_types:
        melee:                                  # 近战优先
          hp:  {1: 260, 2: 300, 3: 330, 4: 360, 5: 400, 6: 430, 7: 460, 8: 500, 9: 530, 10: 600}
          power_w: {1: 70, 2: 75, 3: 80, 4: 85, 5: 90, 6: 95, 7: 100, 8: 105, 9: 110, 10: 120}
          q0:   {1: 200, 2: 210, 3: 220, 4: 230, 5: 240, 6: 250, 7: 260, 8: 270, 9: 280, 10: 300}
          cool: {1: 12, 2: 14, 3: 16, 4: 18, 5: 20, 6: 22, 7: 24, 8: 26, 9: 28, 10: 30}
        ranged:                                 # 远程优先
          hp:  {1: 200, 2: 220, 3: 240, 4: 260, 5: 280, 6: 300, 7: 320, 8: 340, 9: 360, 10: 400}
          power_w: {1: 50, 2: 55, 3: 60, 4: 65, 5: 70, 6: 75, 7: 80, 8: 85, 9: 90, 10: 100}
          q0:   {1: 160, 2: 162, 3: 164, 4: 166, 5: 168, 6: 170, 7: 175, 8: 180, 9: 185, 10: 190}
          cool: {1: 20, 2: 23, 3: 26, 4: 29, 5: 32, 6: 35, 7: 38, 8: 41, 9: 44, 10: 50}
    infantry:
      launcher: p17
      v0_limit_mps: 25
      chassis:                                  # 表 5-14
        power_priority:
          hp:  {1: 150, 2: 175, 3: 200, 4: 225, 5: 250, 6: 275, 7: 300, 8: 325, 9: 350, 10: 400}
          power_w: {1: 60, 2: 65, 3: 70, 4: 75, 5: 80, 6: 85, 7: 90, 8: 95, 9: 100, 10: 100}
        hp_priority:
          hp:  {1: 200, 2: 225, 3: 250, 4: 275, 5: 300, 6: 325, 7: 350, 8: 375, 9: 400, 10: 400}
          power_w: {1: 45, 2: 50, 3: 55, 4: 60, 5: 65, 6: 70, 7: 75, 8: 80, 9: 90, 10: 100}
      launcher_types:                           # 表 5-15
        burst:
          q0:   {1: 170, 2: 180, 3: 190, 4: 200, 5: 210, 6: 220, 7: 230, 8: 240, 9: 250, 10: 260}
          cool: {1: 5, 2: 7, 3: 9, 4: 11, 5: 12, 6: 14, 7: 16, 8: 18, 9: 18, 10: 20}
        cooling:
          q0:   {1: 40, 2: 48, 3: 56, 4: 64, 5: 72, 6: 80, 7: 88, 8: 96, 9: 114, 10: 120}
          cool: {1: 12, 2: 14, 3: 16, 4: 18, 5: 20, 6: 22, 7: 24, 8: 26, 9: 28, 10: 30}
    aerial:
      launcher: p17
      v0_limit_mps: 25
      launcher_types:                           # 表 5-16
        q0:   {1: 100, 2: 110, 3: 120, 4: 130, 5: 140, 6: 150, 7: 160, 8: 170, 9: 180, 10: 200}
        cool: {1: 20, 2: 30, 3: 40, 4: 50, 5: 60, 6: 70, 7: 80, 8: 90, 9: 100, 10: 120}
    sentry:
      launcher: p17
      variants:
        manual: {hp: 400, q0: 260, cool: 30}    # 表 3-7（PDF p31）
        auto:   {hp: 200, q0: 100, cool: 10}
    engineer:
      launcher: none
      hp: 250
      power_w: 120
      no_exp: true
      source: "§3.4 表 3-4 (PDF p26)"

# ---------------------------------------------------------------- 基地/前哨站（§5.5.1）
base_outpost:
  base_hp: 5000
  base_shield: 150                              # 虚拟护盾，不计入基地血量损失
  outpost_hp: 1500
  source: "§5.5.1 (PDF p97)"

# ---------------------------------------------------------------- 回血/复活（§5.2）
heal_revive:
  supply_heal_per_s: 0.10                       # 占领己方补给区：每秒上限血量 10%
  supply_heal_ooc_after_s: 240                  # 4 分钟后 + 脱战：25%/s
  supply_heal_ooc_per_s: 0.25
  remote_heal: 0.60                             # 远程兑换血量：6 s 后 +60%（不超上限）
  remote_heal_delay_s: 6
  revive_formula: "10 + (420 - t_left)/10 + 20*n_buyback"   # 秒，四舍五入取整
  revive_x4_when: [in_supply, base_hp_below_2000]
  buyback_hp_frac: 1.0                          # 金币立即复活：回满血 + 底盘功率上限×1（≤200W）
  on_death: {heat: 0, buffer_energy: full}
  source: "§5.2.1/§5.2.2 (PDF p74-75)"

# ---------------------------------------------------------------- 弹药经济（§5.3）
economy:
  ammo_cap: {p17: 1000, p42: 100}               # 金币兑换上限（每队）
  ammo_remote_rate: {p17: {gold: 150, rounds: 100}, p42: {gold: 150, rounds: 10}}
  ammo_local_rate:  {p17: {gold: 10, rounds: 10},  p42: {gold: 10, rounds: 1}}
  initial_gold: 400
  source: "§5.3 表 5-6 (PDF p78)"

# ---------------------------------------------------------------- 其他机制
misc:
  hero_42mm_suppression_s: 4                    # 英雄连续 4s 未发 42mm -> 对方屏蔽 42mm 伤害
  source: "§5.1.1 (PDF p68)"
  unsimulated:                                  # 明确列出"不建模"的机制及原因
    sentry_posture: "哨兵姿态（进攻/防御/移动 + 强化）——对自瞄评估无直接影响"
    buff_points: "增益点/能量机关/堡垒——属于战术层"
    dart_system: "飞镖系统（闸门/目标选择/检测窗口）"
    radar: "雷达与激光"
