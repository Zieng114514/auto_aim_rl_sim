# =============================================================================
#  弹丸散布
#
#  为什么分成三类（负责人 2026-10-14 指出）：真实散布不是单一来源 ——
#    1) 枪口角散布      ：摩擦轮/枪管的机械一致性，每发随机偏一个角度（现有模型）
#    2) 弹丸直径公差    ：影响摩擦接触与气动阻力 -> 初速与弹道都变
#    3) 弹丸质量公差    ：同转速下初速反比变化（v ∝ 1/m 近似），3.2±0.1g 即 ±3%
#  第 2、3 类以前完全没建模，而它们对"远距离落点"的影响可能比第 1 类更大。
#
#  默认值 = 现状：只有第 1 类生效（其余 enabled: false），保证既有基线可复现。
#  打开后需要用逐发弹道偏移（shot_log 的 off_v/off_h）重新标定一遍再启用。
# =============================================================================
muzzle_angular:
  enabled: true
  sigma_deg_per_axis: 0.15      # 每个正交轴 1σ；合成后总偏差均值≈1.25×σ
  source: "工程默认值【待真机校准】"

from_diameter_tol:
  enabled: false                # ★ 打开前先用 shot_log 标定 k_d
  model: "v0 *= 1 / (1 + k_d * (d - d_nominal)/d_nominal)"
  k_d: 1.0                      # 【待校准】直径偏大 -> 摩擦接触变差 -> 初速下降
  drag_mult: "1 + 2*(d-d_n)/d_n"   # 截面积 ∝ d²，阻力系数随之变化

from_mass_tol:
  enabled: false                # ★ 打开前先用 shot_log 标定 k_m
  model: "v0 *= 1 / (1 + k_m * (m - m_nominal)/m_nominal)"
  k_m: 1.0                      # 【待校准】质量偏大 -> 同转速下初速偏低（近似反比）

ballistic_scatter:
  # 弹速本身的随机波动（摩擦轮与弹丸之间的打滑），现有模型里的 jitter
  enabled: true
  sigma_mps: 0.25               # = jitter 0.5 按 2σ 解释
  source: "工程默认值【待真机校准】"

notes:
  - "打开 from_* 两项后，弹速分布会从'单一 jitter'变成'jitter + 公差传递'，"
  - "  **命中率会下降**（远距离更明显），需要重新标一遍 pitch_offset 与开火门限。"
  - "标定口径：sp_vision_25/sim/README.md §5.1（逐发 off_v/off_h 连续量，不要用命中率）。"
