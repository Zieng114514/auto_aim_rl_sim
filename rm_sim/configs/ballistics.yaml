# =============================================================================
#  弹道：重力 + 空气阻力
#
#  现状（**默认**，与既有基线逐位一致）：只有重力。弹丸是 MuJoCo 刚体，
#  `<option gravity="0 0 -9.81">` + 1 kHz Euler + CCD —— 没有空气阻力、没有自旋。
#  这与 sp_vision 的弹道解算器（`sp_vision_25/tools/trajectory.cpp` 的闭式抛物线、g=9.7833）
#  以及 `auto_aim_rl/env/mirror.py` 里的镜像解算器**口径一致**：
#  两边都"只有重力"，所以这不是 bug，而是两边都缺同一块物理。
#
#  ⚠️ 打开阻力之前必须先做三件事，否则会把"更真实"变成"系统性脱靶"：
#    1) **同步解算器**：C++ `tools/trajectory.cpp` 与 Python 镜像 `env/mirror.py` 的弹道解算
#       都要带同一个阻力模型（现在是闭式解，加不了阻力项，得改成数值/迭代解）；
#    2) **重标 `pitch_offset`**（5 m 处会偏 ~1.5 cm）；
#    3) **重录全部基线 + 黄金轨迹 hash 会变**（开阻力必然改轨迹）。
#
#  量级（v0=24 m/s、17mm/3.2 g、ρ=1.225、Cd=0.47；解析对照见 `rm_sim/test_ballistics.py`）：
#      距离（水平）    3 m     5 m     8 m     10 m
#      落点偏差       -0.3    -1.5    -6.5    -13.0  cm   ← 相对"只有重力"的模型
#      飞行时间       +3%     +5%     +9%     +11%       ← 对提前量预测的影响比落点更大
#  小装甲板半高 6.5 cm ⇒ **8 m 起误差就吃掉整块板**，远距离必须建模。
# =============================================================================
drag:
  enabled: false            # ★ 默认关：保证既有基线与黄金轨迹逐位不变
  rho_kg_m3: 1.225          # 空气密度：海平面 15 ℃；室内 25 ℃ 约 1.18【待真机校准】
  cd: 0.47                  # 光滑球阻力系数。我们的 Re = v·d/ν ≈ 2.8e4，落在亚临界平台
                            # （Cd≈0.45~0.50 比较平），所以用常数 Cd 是站得住的【待真机校准】
  diameter_mm: 17.0         # 与仿真弹丸 geom 半径 8.5 mm 取齐（改这个会同时改碰撞半径，
                            # 所以**不动**）；规则手册标称 16.8±0.2（projectiles.yaml 表 4-1），
                            # 面积差 2.4% ⇒ 阻力差约 1%，对落点影响 < 1 mm
  mass_g: 3.2               # 与 BALL_MASS 一致（手册 3.2±0.1）
  source: "工程默认值（ρ、Cd）+ RoboMaster 手册表 4-1（几何/质量）【待真机校准】"

# 自旋（马格努斯力）—— 已实现，**默认关**。
#
# 真机的 17mm 是被两个摩擦轮夹着甩出去的，出膛必然带自旋；横向马格努斯力
#   F = ½·ρ·A·C_L(S)·|v|²·(ω̂ × v̂)，   S = ω·r/|v|（自旋比，无量纲）
# 方向按右手定则（ω̂ × v̂）：自旋轴指向哪里、力就垂直于"自旋轴 × 速度"。
# 弹丸的 ω 存在 MuJoCo 的角速度里（qvel 后三维），力从**真实 ω** 算 —— 所以将来
# 若要加"自旋衰减"，只要给 ω 加衰减即可，力的方向与大小会自动跟着变。
#
# 量级（ω=500 rad/s ⇒ S≈0.18 ⇒ C_L≈0.11，v0=24 m/s）：
#   横向加速度 ≈2 m/s² ⇒ 5 m 处横漂 ~4.6 cm、8 m ~12 cm
# 与空气阻力造成的**竖直**误差同级，但它是**横向**的 —— 也就是真机"弹道会飘"的来源。
#
# ⚠️ 校准入口（现成）：`shot_log` 逐发记 `off_h`（沿板宽方向偏差）⇒ 真机在 3/5/8 m
#   各打 N 发，用 off_h 随距离的增长（**横漂 ∝ d²**）反推 ω；C_L 的斜率同样可反推。
#   在此之前 `omega_rad_s` / `cl_slope` 都是工程默认值【待真机校准】。
spin:
  enabled: false            # ★ 默认关：保证既有基线与黄金轨迹逐位不变
  omega_rad_s: 500.0        # 出膛自旋角速度大小【待真机校准】
  # 自旋轴方向（相对**炮管**，单位向量由 muzzle site 的姿态给出）：
  #   barrel_up   = 炮管的"上"方向（世界 up 垂直于炮管的分量）⇒ 马格努斯力**横向**
  #   barrel_side = 炮管的"右"方向                              ⇒ 马格努斯力**竖直**
  axis: "barrel_up"
  cl_slope: 0.6             # C_L = min(cl_slope·S, cl_max)【待真机校准】
  cl_max: 0.35
  spin_decay_tau_s: 0.0     # 自旋衰减时间常数；0 = 不衰减（飞行 ~0.3 s，本来就可忽略）
  source: "马格努斯力形式 = 经典 ½ρAC_Lv²(ω̂×v̂)；C_L(S) 取光滑球经验量级【待真机校准】"
  note: "打开前同样要先同步两个解算器（C++ trajectory.cpp / env/mirror.py 的横漂修正）"

